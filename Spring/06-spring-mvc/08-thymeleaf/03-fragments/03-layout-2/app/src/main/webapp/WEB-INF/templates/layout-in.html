<!DOCTYPE html>
<html th:fragment="layout (content_in, js)" th:replace="~{layout-out :: layout(~{::#page}, ~{::script})}">
<head>
    <title>Layout In Title</title>
</head>
<body>
    <div id="page">
        <h1>Generic H1</h1>
        <main>
            <div th:replace="${content_in}">HELLO WORLD</div>
        </main>
    </div>
    <script th:src="@{/js/layout-in.js}"></script>
    <script th:replace="${js}"></script>
</body>
</html>
